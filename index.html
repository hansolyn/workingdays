<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>근태 현황 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>window.XLSX || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>window.Chart || document.write('<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"><\/script>');</script>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --border:#E2E8F0; --text:#0F172A; --text-2:#64748B;
  --primary:#0A7CC4; --primary-bg:#E6F2FA;
  --danger:#C8283C; --danger-bg:#FDECEE; --danger-border:#F3B4BC;
  --warn:#B45309; --warn-bg:#FEF3E2; --warn-border:#F5CF94;
  --ok:#15803D; --ok-bg:#E8F6EC; --ok-border:#A9DDB7;
  --info:#1D5FA8; --info-bg:#E8F1FB; --info-border:#B5CFEF;
  --muted:#64748B; --muted-bg:#F1F5F9; --muted-border:#CBD5E1;
  --disc:#6D4BC4; --disc-bg:#F1ECFB; --disc-border:#C9B8EE;
  --shadow:0 1px 2px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-width:1024px}
.num,td,.kpi-num{font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit;font-size:13px;color:var(--text)}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s12{width:12px;height:12px}
svg.i.s14{width:14px;height:14px}
svg.i.s20{width:20px;height:20px}
svg.i.s24{width:24px;height:24px}
svg.i.s40{width:40px;height:40px;stroke-width:1.5}

/* 헤더 */
.topbar{background:var(--surface);border-bottom:1px solid var(--border)}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.header{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-tile{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
.brand h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--text-2);font-size:12px}
.hdr-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:600;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger-text{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
select.sel,input.inp{height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px}
select.sel:focus,input.inp:focus{outline:2px solid rgba(10,124,196,.25);border-color:var(--primary)}

main{padding:24px 0 48px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}

/* 업로드 */
.upload-wrap{display:flex;justify-content:center;padding:56px 0}
.upload-card{width:640px;padding:40px;text-align:center}
.drop{border:2px dashed var(--border);border-radius:12px;padding:40px 24px;background:var(--surface-2);transition:.15s}
.sample-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-size:13px;color:var(--text-2)}
.drop.over{border-color:var(--primary);background:var(--primary-bg)}
.drop .ic{color:var(--primary);margin-bottom:12px}
.drop h2{font-size:17px;margin:0 0 6px}
.drop p{color:var(--text-2);margin:0 0 18px;font-size:13px;line-height:1.6}
.upload-note{margin-top:16px;color:var(--text-2);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.err-box{margin-top:16px;text-align:left;background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6}

/* 배너 */
.banner{display:flex;align-items:stretch;gap:20px;padding:20px 24px;border-radius:12px}
#dashView{padding-top:24px}
.banner-left{min-width:230px;padding-right:20px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:6px}
.banner-left .eyebrow{font-size:12px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.banner-left .period{font-size:15px;font-weight:700}
.banner-left .count{font-size:12px;color:var(--text-2)}
.banner-box{flex:1;border-radius:10px;padding:16px 20px;border:1px solid;cursor:pointer;text-align:left;background:none;display:flex;flex-direction:column;gap:6px;transition:.12s}
.banner-box:hover{transform:translateY(-1px)}
.banner-box .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.banner-box .n{font-size:30px;font-weight:700;line-height:1.1}
.banner-box .n small{font-size:16px;margin-left:2px}
.banner-box .sub{font-size:12px;opacity:.85}
.banner-box.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.banner-box.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.banner-box.active{box-shadow:0 0 0 2px currentColor inset}

.alerts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid;font-size:13px}
.alert .msg{flex:1;line-height:1.5}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-border);color:#7A3A06}
.alert.info{background:var(--info-bg);border-color:var(--info-border);color:var(--info)}
.alert.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.alert .x{background:none;border:0;color:inherit;padding:4px;border-radius:6px;display:flex}
.alert .x:hover{background:rgba(0,0,0,.05)}

/* 탭 */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:20px 0 16px;box-shadow:var(--shadow)}
.tab{display:flex;align-items:center;gap:6px;height:36px;padding:0 18px;border-radius:8px;border:0;background:none;font-weight:600;color:var(--text-2);font-size:14px}
.tab.active{background:var(--primary);color:#fff}
.tab:not(.active):hover{background:var(--surface-2);color:var(--text)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);min-height:118px;display:flex;flex-direction:column}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.kpi .kpi-num{font-size:32px;font-weight:700;margin:8px 0 6px;line-height:1.1}
.kpi .kpi-num small{font-size:16px;font-weight:600;margin-left:2px}
.kpi .ks{font-size:12px;color:var(--text-2);line-height:1.5}
.kpi.danger{border-color:var(--danger-border)} .kpi.danger .kt,.kpi.danger .kpi-num{color:var(--danger)}
.kpi.warn{border-color:var(--warn-border)} .kpi.warn .kt,.kpi.warn .kpi-num{color:var(--warn)}
.kpi.info{border-color:var(--info-border)} .kpi.info .kt,.kpi.info .kpi-num{color:var(--info)}
.kpi.muted{border-color:var(--border)} .kpi.muted .kt{color:var(--muted)} .kpi.muted .kpi-num{color:var(--text)}
.help{position:relative;display:inline-flex;color:var(--text-2);cursor:help}
.help .tip{display:none;position:absolute;right:-8px;top:22px;width:250px;background:var(--text);color:#fff;font-size:12px;font-weight:400;padding:8px 10px;border-radius:8px;line-height:1.5;z-index:30}
.help:hover .tip{display:block}

/* 필터 바 */
.filterbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:16px;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip .c{font-size:11px;font-weight:700;background:var(--muted-bg);color:var(--text-2);border-radius:999px;padding:1px 7px}
.chip:hover{color:var(--text)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.active .c{background:rgba(255,255,255,.22);color:#fff}
.fright{display:flex;gap:8px;align-items:center}
.search{position:relative}
.search svg{position:absolute;left:10px;top:10px;color:var(--text-2)}
.search input{padding-left:32px;width:220px}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);border-radius:8px;color:var(--text-2)}
.iconbtn:hover{color:var(--text);background:var(--surface-2)}

/* 테이블 */
.tbl-card{overflow:hidden}
.tbl-scroll{overflow:auto;max-height:calc(100vh - 140px)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;z-index:2;user-select:none}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{color:var(--text)}
table.t th .arr{font-size:10px;margin-left:3px;color:var(--primary)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:var(--surface-2)}
table.t tr.dim td{color:var(--text-2);background:#FBFCFD}
table.t td.r,table.t th.r{text-align:right}
table.t td.c,table.t th.c{text-align:center}
.sub2{display:block;font-size:11px;color:var(--text-2);margin-top:2px}
.dash{color:#A0AEC0}
.red{color:var(--danger);font-weight:700}
.empty{padding:48px;text-align:center;color:var(--text-2)}

/* 배지·태그 */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.action{background:var(--danger-bg);color:var(--danger)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.leave,.badge.excluded{background:var(--muted-bg);color:var(--muted)}
.badge.disc{background:var(--disc-bg);color:var(--disc)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid}
.tag.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.tag.minor{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.tag.disc{background:var(--disc-bg);color:var(--disc);border-color:var(--disc-border)}
.tag.muted{background:var(--muted-bg);color:var(--muted);border-color:var(--muted-border)}
.tag.health{background:#FFF1F4;color:#BE185D;border-color:#F9C2D3}
.tags{display:flex;gap:4px;flex-wrap:wrap;max-width:340px;white-space:normal}

/* 상세 패널 */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.backdrop.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:520px;background:var(--surface);z-index:51;box-shadow:-8px 0 24px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.panel.show{transform:none}
.panel-hd{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}
.panel-hd h3{margin:0;font-size:19px}
.panel-hd .meta{color:var(--text-2);font-size:13px;margin-top:4px}
.panel-bd{flex:1;overflow:auto;padding:16px 24px 32px}
.sec-t{font-size:13px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec-t .s{font-weight:400;font-size:12px;color:var(--text-2)}
.stat6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat6 div{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.stat6 b{display:block;font-size:17px;margin-top:2px}
.stat6 span{font-size:11px;color:var(--text-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--text-2);text-align:center;padding:2px 0}
.cal .cell{height:50px;border-radius:8px;border:1px solid transparent;padding:4px 6px;font-size:11px;display:flex;flex-direction:column;justify-content:space-between}
.cal .cell .d{font-weight:700}
.cal .cell .v{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-late{background:var(--warn-bg);color:var(--warn)}
.st-bad{background:var(--danger-bg);color:var(--danger)}
.st-vac{background:var(--info-bg);color:var(--info)}
.st-leave{background:repeating-linear-gradient(135deg,#E2E8F0 0 4px,#F1F5F9 4px 8px);color:var(--muted)}
.st-hol{background:#F3F5F8;color:#94A3B8}
.st-none{background:transparent}
.hw{border:2px solid var(--disc)!important}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.tl{font-size:11px}
.tl-axis{display:flex;margin-left:62px;position:relative;height:16px;color:var(--text-2)}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-row{display:flex;align-items:center;height:16px}
.tl-row .lb{width:62px;color:var(--text-2);font-variant-numeric:tabular-nums}
.tl-row .lb.hol{color:#A0AEC0}
.tl-track{flex:1;height:10px;position:relative;background:var(--surface-2);border-radius:3px}
.tl-bar{position:absolute;top:0;bottom:0;background:#7FB2DD;border-radius:2px}
.tl-bar.night{background:#1E3A8A}
.tl-ref{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--danger);opacity:.45}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
.wk{display:flex;align-items:flex-end;gap:10px;height:150px;position:relative;padding-top:8px;border-bottom:1px solid var(--border)}
.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;z-index:1}
.wk .bar{width:100%;max-width:56px;background:#7FB2DD;border-radius:4px 4px 0 0}
.wk .bar.over{background:var(--danger)}
.wk .val{font-size:11px;font-weight:600;margin-bottom:3px;font-variant-numeric:tabular-nums}
.wk .line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--danger);z-index:2}
.wk .line span{position:absolute;right:0;top:-16px;font-size:10px;color:var(--danger);background:var(--surface);padding:0 2px}
.wk-lb{display:flex;gap:10px;margin-top:4px}
.wk-lb div{flex:1;text-align:center;font-size:11px;color:var(--text-2)}
.r28{display:flex;gap:8px;margin-top:12px}
.r28 div{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.r28 b{font-size:17px;display:block}
.r28 span{font-size:11px;color:var(--text-2)}

/* 일자별 */
.panel-card{padding:18px 20px;margin-bottom:16px}
.pc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pc-hd h3{margin:0;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;color:var(--text-2);font-size:12px}
.seg button.active{background:var(--primary);color:#fff}
.heat-wrap{overflow:auto;max-height:640px}
table.heat{border-collapse:separate;border-spacing:2px;font-size:11px}
table.heat th{position:sticky;top:0;background:var(--surface);color:var(--text-2);font-weight:600;z-index:2;padding:2px 0;min-width:24px}
table.heat th.wkend{color:#A0AEC0}
table.heat td.nm{position:sticky;left:0;background:var(--surface);z-index:1;padding-right:8px;white-space:nowrap;min-width:150px}
table.heat td.nm .dp{color:var(--text-2);font-size:11px;margin-left:4px}
table.heat td.hc{width:24px;height:20px;border-radius:4px;cursor:default}
table.heat tr.grp td{font-size:11px;font-weight:700;color:var(--text-2);padding-top:8px}
.tooltip{position:fixed;z-index:80;background:var(--text);color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;line-height:1.55;display:none;max-width:260px}
.chart-box{position:relative;height:280px}
table.heat td.st-ok{background:#CBEBD4;color:var(--ok)}
table.heat td.st-late{background:#F2B65E}
table.heat td.st-bad{background:var(--danger)}
table.heat td.st-vac{background:#8DB6E6}
table.heat td.st-hol{background:#EEF1F5}
table.heat td.lday{box-shadow:inset 0 0 0 2px #EAB308}
table.heat td.wko{position:relative}
table.heat td.wko::after{content:'';position:absolute;top:-2px;bottom:-2px;left:-2px;right:-2px;border-top:2px solid var(--danger);border-bottom:2px solid var(--danger);pointer-events:none}
table.heat td.hw.wko::after{top:-4px;bottom:-4px;left:-4px;right:-4px}
table.heat td.wko-s::after{border-left:2px solid var(--danger);border-top-left-radius:5px;border-bottom-left-radius:5px}
table.heat td.wko-e::after{border-right:2px solid var(--danger);border-top-right-radius:5px;border-bottom-right-radius:5px}
.legend i.lg-lday{background:#fff;box-shadow:inset 0 0 0 2px #EAB308}
.legend i.lg-wko{background:#fff;border:2px solid var(--danger);border-radius:3px}

/* 부서별 */
table.t tr.grp-row td{background:var(--surface-2);font-weight:700}
table.t tr.mid-row td{background:#FBFCFE}
table.org-ed{width:100%;border-collapse:collapse;font-size:13px}
table.org-ed th{font-size:12px;color:var(--text-2);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--border)}
table.org-ed td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
table.org-ed tr.lv0 td{background:var(--surface-2)}
table.org-ed .c{text-align:center} table.org-ed .r{text-align:right}
button.mini{border:1px solid var(--border);background:var(--surface);border-radius:6px;height:24px;min-width:24px;padding:0 4px;font-size:10px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;margin-right:2px}
button.mini:hover{color:var(--text);background:var(--surface-2)}
.dept-chart-box{position:relative}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 0;overflow:auto}
.modal-bg.show{display:flex}
.modal{width:860px;background:var(--surface);border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.2);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal-hd{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-hd h3{margin:0;font-size:17px}
.modal-bd{padding:8px 24px 20px;overflow:auto;flex:1}
.modal-ft{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
.mset{padding:16px 0;border-bottom:1px solid var(--border)}
.mset:last-child{border-bottom:0}
.mset h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:6px}
.mset .desc{font-size:12px;color:var(--text-2);margin:0 0 10px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px;min-height:40px;background:var(--surface)}
.tagbox .tg{display:inline-flex;align-items:center;gap:4px;background:var(--muted-bg);border-radius:6px;padding:3px 4px 3px 8px;font-size:12px}
.tagbox .tg.miss{background:var(--warn-bg);color:var(--warn)}
.tagbox .tg button{border:0;background:none;padding:0;display:flex;color:var(--text-2)}
.tagbox input{border:0;outline:0;flex:1;min-width:140px;height:26px}
.flabel{font-size:12px;font-weight:600;color:var(--text-2);margin:10px 0 6px}
.leave-row{display:grid;grid-template-columns:1fr 160px 160px 36px;gap:8px;margin-bottom:8px;align-items:center}
.grp-edit{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
.grp-edit .gh{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.th-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.th-grid label{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.th-grid .u{display:flex;align-items:center;gap:6px}
.th-grid input{width:100%}
.notice{font-size:12px;border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.6}
.notice.warn{background:var(--warn-bg);color:#7A3A06;border:1px solid var(--warn-border)}
.notice.info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)}
.copyright{text-align:center;color:var(--text-2);font-size:12px;padding:8px 16px 32px}
.footnote{color:var(--text-2);font-size:12px;margin-top:16px;line-height:1.6}
.hidden{display:none!important}
/* 보고서 */
#reportView{position:fixed;inset:0;z-index:70;background:#E5E9EF;display:flex;flex-direction:column}
.rpt-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.rpt-tb-l{display:flex;flex-direction:column;gap:2px}.rpt-tb-l span{font-size:12px;color:var(--text-2)}
.rpt-tb-r{display:flex;gap:8px}
.rpt-scroll{flex:1;overflow:auto;padding:24px 0 48px}
.paper{width:210mm;min-height:297mm;margin:0 auto 20px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12);padding:14mm 14mm 12mm;color:#0F172A;font-size:10pt;line-height:1.5}
.paper h1{font-size:18pt;margin:0;letter-spacing:-.3px}
.paper h2{font-size:12pt;margin:13px 0 7px;padding-bottom:4px;border-bottom:2px solid #0F172A;display:flex;justify-content:space-between;align-items:baseline}
.paper h2 small{font-size:8.5pt;font-weight:400;color:#64748B}
.rpt-hd{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px;border-bottom:1px solid #CBD5E1;margin-bottom:6px}
.rpt-meta{font-size:9pt;color:#475569;text-align:right;line-height:1.6}
.ed{border:1px dashed #94A3B8;border-radius:4px;padding:1px 4px;min-width:40px;display:inline-block;outline:none}
.ed:focus{border-color:var(--primary);background:#F0F7FC}
.rpt-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.rpt-kpi{border:1px solid #CBD5E1;border-radius:6px;padding:5px 9px}
.rpt-kpi .l{font-size:8.5pt;color:#475569}
.rpt-kpi .v{font-size:14pt;font-weight:700;line-height:1.25}
.rpt-kpi .v small{font-size:9pt;font-weight:600;margin-left:1px}
.rpt-kpi .d{font-size:8.5pt;color:#64748B}
.rpt-kpi.danger{border-color:#F3B4BC;background:#FFF7F8}.rpt-kpi.danger .v{color:#C8283C}
.rpt-kpi.warn{border-color:#F5CF94;background:#FFFBF4}.rpt-kpi.warn .v{color:#B45309}
.up{color:#C8283C}.down{color:#15803D}.flat{color:#64748B}
.rpt-sum{margin:8px 0 0;padding:0 0 0 16px}
.rpt-sum li{margin:1px 0}
table.rt{width:100%;border-collapse:collapse;font-size:8.8pt}
table.rt th{background:#F1F5F9;color:#334155;font-weight:600;padding:4px 6px;border-top:1px solid #94A3B8;border-bottom:1px solid #CBD5E1;text-align:left;white-space:nowrap}
table.rt td{padding:2.6px 6px;border-bottom:1px solid #E2E8F0;vertical-align:top}
table.rt td.r,table.rt th.r{text-align:right}
table.rt td.c,table.rt th.c{text-align:center}
table.rt tr.tot td{font-weight:700;background:#F8FAFC;border-top:1px solid #94A3B8}
table.rt tr.top td{font-weight:700;background:#FBFCFE}
table.rt tr{break-inside:avoid}
.bar-cell{display:flex;align-items:center;gap:5px}
.bar-cell i{display:inline-block;height:7px;background:#93B8DE;border-radius:2px}
.bar-cell i.over{background:#E58A96}
.pill{display:inline-block;font-size:8pt;font-weight:600;padding:0 6px;border-radius:9px;white-space:nowrap}
.pill.action{background:#FDECEE;color:#C8283C}.pill.warn{background:#FEF3E2;color:#B45309}.pill.ok{background:#E8F6EC;color:#15803D}
.pill.disc{background:#F1ECFB;color:#6D4BC4}.pill.health{background:#FFF1F4;color:#BE185D}.pill.muted{background:#F1F5F9;color:#64748B}
.crit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;break-inside:avoid}
.keep{break-inside:avoid}
.crit div{border:1px solid #CBD5E1;border-radius:6px;padding:7px 9px;font-size:8.6pt;line-height:1.5}
.crit b{display:block;font-size:9.5pt;margin-bottom:3px}
.crit ul{margin:0;padding-left:14px}
.crit .a{border-color:#F3B4BC;background:#FFF7F8}.crit .a b{color:#C8283C}
.crit .w{border-color:#F5CF94;background:#FFFBF4}.crit .w b{color:#B45309}
.crit .h{border-color:#F9C2D3;background:#FFF8FA}.crit .h b{color:#BE185D}
.opinion{min-height:28mm;border:1px dashed #94A3B8;border-radius:6px;padding:8px 10px;outline:none;white-space:pre-wrap}
.opinion:focus{border-color:var(--primary)}
.opinion:empty:before{content:attr(data-ph);color:#94A3B8}
.rpt-note{font-size:8pt;color:#64748B;margin-top:10px;line-height:1.55}
.rpt-foot{font-size:8pt;color:#94A3B8;display:flex;justify-content:space-between;margin-top:10px;padding-top:6px;border-top:1px solid #E2E8F0}
@page{size:A4 portrait;margin:11mm 12mm 11mm}
@media print{
  html,body{background:#fff!important;min-width:0}
  body>*:not(#reportView){display:none!important}
  #reportView{position:static;display:block!important;background:#fff}
  .rpt-toolbar{display:none}
  .rpt-scroll{overflow:visible;padding:0}
  .paper{box-shadow:none;margin:0;min-height:auto;padding:0;width:auto;break-after:page}
  .paper:last-child{break-after:auto}
  .ed,.opinion{border-color:transparent}
  .opinion:empty{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>

<!-- 경영진 보고서 -->

    <div class="rpt-tb-r"><button class="btn primary" id="btnPrint"><span data-ic="printer"></span>인쇄 / PDF 저장</button><button class="btn" id="btnCloseReport"><span data-ic="x"></span>닫기</button></div>
  </div>

<script>
/* ===================== 계산 코어 (parse → classify → computeDaily → aggregate → judge) ===================== */
const DEFAULT_SETTINGS = {
  version: 2,
  excludeTitles: ['대표이사', '자문위원'],
  excludeNames: [],
  leaves: [],
  // 조직도: 배열 순서 = 같은 상위 조직 안의 표시 순서, parent '' = 최상위
  org: [],
  // 재량근로 부서 (조직도와 별개)
  discretionDepts: [],
  knownDepts: [],
  thresholds: {
    breakWorkday: 60,          // 근무일 휴게(분)
    breakHalfAM: 0,            // 오전반차 휴게
    breakHalfPM: 60,           // 오후반차 휴게
    holidayBreakLong: 510,     // 휴일근무: 체류 8:30 이상 → 60분
    holidayBreakLongMin: 60,
    holidayBreakShort: 270,    // 휴일근무: 체류 4:30 이상 → 30분
    holidayBreakShortMin: 30,
    contractDay: 480,          // 근무일 소정근로(분)
    contractHalf: 240,         // 반차 소정근로(분)
    extraDayMin: 60,           // 추가 체류일 기준(분)
    nightDayMin: 30,           // 야간 체류일 기준(분)
    nightWeight: 0.3,          // 야간 가산
    longDayH: 12,              // 히트맵: 장시간 체류일 기준(순체류, h)
    weekLimitH: 52,            // 주 순체류 기준(h)
    avg28LimitH: 64,           // 28일 환산 주평균 기준(h)
    avg84LimitH: 60,           // 84일 환산 주평균 기준(h)
    lateCnt: 3,                // 주의: 지각 횟수
    earlyCnt: 3,               // 주의: 조기퇴근 횟수
    extraDays: 5,              // 주의: 추가 체류일
    nightDays: 4,              // 주의: 야간 체류일
    newLeaveRatio: 0.8,        // 신규 휴직자 감지: 결근 비율
    logStayDiff: 2             // U열과 계산 체류 차이 로그 기준(분)
  }
};

const EXPECTED_HEADERS = ['부서', '직책', '직급', '이름', '일자', '요일', '근무여부', '근태상태', '근태', '근무유형'];
const FIELD_KEYS = ['dept', 'title', 'grade', 'name', 'date', 'dow', 'dayType', 'status', 'leave', 'workType', 'plan', 'planHours', 'breakPlan', 'otPlan', 'in', 'out', 'worked', 'basic', 'ot', 'leaveHours', 'stay'];
const OUTSIDE_LEAVES = ['국내출장', '출근 후 외근'];
const HALF_LEAVES = ['오전반차', '오후반차'];

/* ---------- 시간 유틸 ---------- */
function toMin(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') { return Math.round(v * 1440); }
  if (v instanceof Date) { return v.getHours() * 60 + v.getMinutes() + Math.round(v.getSeconds() / 60); }
  const s = String(v).trim();
  if (!s) return null;
  const m = s.match(/^(\d{1,3}):(\d{1,2})(?::(\d{1,2}))?$/);
  if (!m) return null;
  return +m[1] * 60 + +m[2] + (m[3] ? +m[3] / 60 : 0);
}
function toMinFloor(v) { const x = toMin(v); return x === null ? null : Math.floor(x); }
function toDateStr(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return d.toISOString().slice(0, 10);
  }
  if (v instanceof Date) {
    const y = v.getFullYear(), mo = String(v.getMonth() + 1).padStart(2, '0'), da = String(v.getDate()).padStart(2, '0');
    return `${y}-${mo}-${da}`;
  }
  const s = String(v).trim().replace(/[./]/g, '-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return null;
  return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
}
function dayNum(ds) { const [y, m, d] = ds.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
function numToDate(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function dowIdx(ds) { return new Date(dayNum(ds) * 86400000).getUTCDay(); } // 0=일
function weekStart(ds) { const n = dayNum(ds); const w = (dowIdx(ds) + 6) % 7; return numToDate(n - w); }
function fmtHM(min) {
  if (min === null || min === undefined || isNaN(min)) return '---';
  const neg = min < 0; min = Math.round(Math.abs(min));
  return (neg ? '-' : '') + Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');
}
function fmtClock(min) {
  if (min === null || min === undefined || isNaN(min)) return '---';
  min = Math.round(min);
  return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
}
function fmtH(min, digits = 1) {
  if (min === null || min === undefined || isNaN(min)) return '---';
  return (Math.round(min / 60 * 10 ** digits) / 10 ** digits).toFixed(digits) + 'h';
}
function hNum(min, digits = 1) { return Math.round(min / 60 * 10 ** digits) / 10 ** digits; }

/* ---------- 1. parse ---------- */
function parseWorkbook(wb, fileName) {
  const warnings = [];
  let sheetName = wb.SheetNames.find(n => n.trim() === '세부현황_관리자');
  let aoa;
  if (sheetName) {
    aoa = sheetAOA(wb.Sheets[sheetName]);
  } else {
    for (const n of wb.SheetNames) {
      const a = sheetAOA(wb.Sheets[n]);
      const head = (a[0] || []).concat(a[1] || []).map(x => String(x).trim());
      if (head.includes('일자') && head.includes('출근시간')) { sheetName = n; aoa = a; break; }
    }
  }
  if (!sheetName) throw new Error(`[${fileName}] '세부현황_관리자' 시트를 찾지 못했습니다. 헤더에 '일자'와 '출근시간'이 있는 시트도 없습니다.`);
  const h1 = (aoa[0] || []).map(x => String(x).trim());
  EXPECTED_HEADERS.forEach((hd, i) => {
    if (h1[i] !== hd) warnings.push(`[${fileName}] ${sheetName} 시트 ${String.fromCharCode(65 + i)}열 머리글이 '${hd}'가 아닙니다(현재: '${h1[i] || '빈값'}').`);
  });
  if (h1[14] !== '출근시간' || h1[15] !== '퇴근시간') warnings.push(`[${fileName}] ${sheetName} 시트 O·P열 머리글이 '출근시간'·'퇴근시간'이 아닙니다.`);
  const rows = [];
  let bad = 0;
  for (let r = 2; r < aoa.length; r++) {
    const a = aoa[r];
    if (!a || a.every(x => x === '' || x === null)) continue;
    const o = {};
    FIELD_KEYS.forEach((k, i) => { o[k] = a[i] === undefined || a[i] === null ? '' : a[i]; });
    ['dept', 'title', 'grade', 'name', 'dow', 'dayType', 'status', 'leave', 'workType', 'plan'].forEach(k => o[k] = String(o[k]).trim());
    o.date = toDateStr(o.date);
    if (!o.name || !o.date) { bad++; continue; }
    rows.push(o);
  }
  if (!rows.length) throw new Error(`[${fileName}] ${sheetName} 시트 3행부터 읽을 데이터가 없습니다(D열 이름·E열 일자 확인).`);
  if (bad) warnings.push(`[${fileName}] 이름 또는 일자를 읽지 못한 행 ${bad}개를 건너뛰었습니다.`);

  // 전체현황 합계 (검증용)
  let summary = null;
  const sn = wb.SheetNames.find(n => n.trim() === '전체현황');
  if (sn) {
    const s = sheetAOA(wb.Sheets[sn]);
    let worked = 0, leaveH = 0;
    for (let r = 2; r < s.length; r++) {
      if (!s[r] || !String(s[r][3] || '').trim()) continue;

"M12 13v8\" /><path d=\"M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242\" /><path d=\"m8 17 4-4 4 4\" />", "circle-pause": "<circle cx=\"12\" cy=\"12\" r=\"10\" /><line x1=\"10\" x2=\"10\" y1=\"15\" y2=\"9\" /><line x1=\"14\" x2=\"14\" y1=\"15\" y2=\"9\" />", "file-text": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\" /><path d=\"M14 2v4a2 2 0 0 0 2 2h4\" /><path d=\"M10 9H8\" /><path d=\"M16 13H8\" /><path d=\"M16 17H8\" />", "printer": "<path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\" /><path d=\"M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6\" /><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\" rx=\"1\" />", "eye": "<path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>"};

/* ===================== 상태 ===================== */
const state = {

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function icon(n, cls = '') { return `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`; }
function hydrateIcons(root = document) { root.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = icon(el.dataset.ic, el.dataset.sz || ''); el.removeAttribute('data-ic'); }); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function monthLabel(m) { const [y, mo] = m.split('-'); return `${y}년 ${+mo}월`; }
function md(ds) { const [, m, d] = ds.split('-'); return `${+m}/${+d}`; }
function h1(min) { return min === null || min === undefined ? '---' : hNum(min).toFixed(1); }
function normalizeSettings(s) {

    leaves: Array.isArray(s.leaves) ? s.leaves.filter(l => l && l.name).map(l => ({ name: String(l.name), start: l.start || '', end: l.end || '' })) : d.leaves,

}

/* ===================== 업로드 ===================== */
function showUploadError(msg) { const b = $('#uploadErr'); b.innerHTML = msg; b.classList.remove('hidden'); }
async function handleFiles(fileList) {
  const files = [...fileList].filter(f => /\.xlsx?$/i.test(f.name));
  $('#uploadErr').classList.add('hidden');
  if (!files.length) { showUploadError('.xlsx 파일을 선택해 주세요.'); return; }
  if (files.length > 3) { showUploadError('파일은 최대 3개(3개월치)까지 올릴 수 있습니다.'); return; }
  if (typeof XLSX === 'undefined') { showUploadError('엑셀 읽기 라이브러리(SheetJS)를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'); return; }
  try {
    const parsed = [];
    for (const f of files) {
      const buf = await f.arrayBuffer();
      let wb;
      try { wb = XLSX.read(buf, { type: 'array', cellDates: false }); }
      catch (e) { throw new Error(`[${f.name}] 엑셀 파일을 열 수 없습니다: ${e.message}`); }
      parsed.push(parseWorkbook(wb, f.name));
    }
    leaveSampleMode();
    state.parsed = parsed;
    state.merged = mergeParsed(parsed);
    state.dismissed = new Set(); state.ignoredLeave = new Set();
    recompute(true);
    $('#uploadView').classList.add('hidden');
    $('#dashView').classList.remove('hidden');
    $('#btnExport').disabled = false;
    $('#btnReport').disabled = false;
  } catch (e) {
    console.error(e);
    showUploadError(esc(e.message));
    $('#uploadView').classList.remove('hidden');
    $('#dashView').classList.add('hidden');
  }
}

/* ===================== 재계산 ===================== */
function recompute(resetMonth) {
  if (!state.merged) return;
  state.model = buildModel(state.merged, state.settings);
  const months = state.model.months;
  if (resetMonth || !months.includes(state.month)) state.month = months[months.length - 1];
  const sel = $('#monthSel');
  sel.innerHTML = months.map(m => `<option value="${m}" ${m === state.month ? 'selected' : ''}>${monthLabel(m)}</option>`).join('');
  sel.classList.toggle('hidden', months.length < 2);
  state.rows = evaluate(state.model, state.month, state.settings);
  state.newDepts = unassignedDepts();
  renderAll();
}
/* 조직도에 없는 부서(고정 제외 인원만 있는 부서는 무시) */
function unassignedDepts() {
  const t = orgTree(state.settings), out = new Set();
  for (const p of state.model.people) for (const r of p.rows) {
    if (t.has(r.dept)) continue;
    if (classifyPerson(state.settings, { name: p.name, dept: r.dept, title: r.title }) === 'excluded') continue;
    out.add(r.dept);
  }
  return [...out].sort((a, b) => a.localeCompare(b, 'ko'));
}
function orgOrder(a, b) { return (a.orgRank - b.orgRank) || a.dept.localeCompare(b.dept, 'ko'); }
function pathText(r, sep = ' › ') { return (r.path || [r.dept]).slice(0, -1).join(sep); }

function workdaysOfMonth() { return state.model.allDates.filter(d => d.slice(0, 7) === state.month && state.model.calendar[d] === '근무일'); }
function datesOfMonth() { return state.model.allDates.filter(d => d.slice(0, 7) === state.month); }

/* ===================== 필터 ===================== */
function chipMatch(r, chip) {
  switch (chip) {
    case 'all': return r.status !== 'excluded' && r.status !== 'leave';
    case 'action': case 'warn': case 'ok': return r.status === chip;
    case 'disc': return r.disc && r.status !== 'excluded' && r.status !== 'leave';
    case 'inactive': return r.status === 'excluded' || r.status === 'leave';
  }
  return true;
}
function deptMatch(r) {
  if (!state.dept) return true;
  if (state.dept.startsWith('o:')) return orgTree(state.settings).subtree(state.dept.slice(2)).has(r.dept);
  return r.dept === state.dept.slice(2);
}
function textMatch(r) {
  const q = state.q.trim().toLowerCase();
  return !q || r.name.toLowerCase().includes(q) || r.dept.toLowerCase().includes(q);
}
function filtered() { return state.rows.filter(r => chipMatch(r, state.chip) && deptMatch(r) && textMatch(r)); }
function activeRows(list) { return list.filter(r => r.status !== 'excluded' && r.status !== 'leave'); }

/* ===================== 렌더: 공통 ===================== */
function renderAll() {
  renderBanner(); renderAlerts(); renderChips(); renderDeptSel(); renderBody();
}
function renderBody() {
  const f = filtered();
  renderKPI(f);
  ['person', 'daily', 'dept'].forEach(t => $('#tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('hidden', state.tab !== t));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  if (state.tab === 'person') renderPerson(f);
  if (state.tab === 'daily') renderDaily(f);
  if (state.tab === 'dept') renderDept(f);
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.chip === state.chip));
  document.querySelectorAll('.banner-box').forEach(b => b.classList.toggle('active', b.dataset.st === state.chip));
  $('#footnote').textContent = LABELS.stayNote;
}

function renderBanner() {

function renderAlerts() {
  const items = [];

  if (state.sample) items.push({ key: 'sample', cls: 'info', ic: 'info', noX: true, msg: `<b>샘플 데이터</b>를 보고 있습니다. 인물·부서·기록은 모두 가상이며, 여기서 바꾼 설정은 저장되지 않습니다.`,

    if (a === 'settings') openSettings();

function renderChips() {
  const cnt = k => state.rows.filter(r => chipMatch(r, k)).length;
  $('#chips').innerHTML = LABELS.chips.map(([k, l]) => `<button class="chip" data-chip="${k}">${l}<span class="c">${cnt(k)}</span></button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { state.chip = c.dataset.chip; renderBody(); });
}

function renderDeptSel() {
  const t = orgTree(state.settings);
  const present = new Set(state.rows.filter(r => r.status !== 'excluded').map(r => r.dept));
  const hasPeople = d => [...t.subtree(d)].some(x => present.has(x));
  let html = `<option value="">전체 부서</option>`;
  for (const root of t.roots()) {
    if (!hasPeople(root)) continue;
    const disc = (state.settings.discretionDepts || []).includes(root);
    let opts = `<option value="o:${esc(root)}">${esc(root)} 전체</option>`;
    const walk = (d, dep) => {
      for (const c of t.children(d)) {
        if (!hasPeople(c)) continue;
        const kids = t.children(c).some(hasPeople);
        opts += `<option value="o:${esc(c)}">${'\u3000'.repeat(dep)}${esc(c)}${kids ? ' (하위 포함)' : ''}</option>`;
        walk(c, dep + 1);
      }
    };
    walk(root, 1);
    html += `<optgroup label="${esc(root)}${disc ? ' · 재량근로' : ''}">${opts}</optgroup>`;
  }
  const un = [...present].filter(d => !t.has(d)).sort((a, b) => a.localeCompare(b, 'ko'));
  if (un.length) html += `<optgroup label="미배정">${un.map(d => `<option value="d:${esc(d)}">${esc(d)}</option>`).join('')}</optgroup>`;
  const sel = $('#deptSel'); sel.innerHTML = html; sel.value = state.dept;
  if (sel.value !== state.dept) { state.dept = ''; sel.value = ''; }
}

  $('#kpis').innerHTML = `
    <div class="kpi danger"><div class="kt">근태 이상${icon('triangle-alert')}</div>
      <div class="kpi-num">${s.absent + s.missing}<small>건</small></div>
      <div class="ks">결근 ${s.absent} · 기록누락 ${s.missing}</div></div>
    <div class="kpi warn"><div class="kt">지각·조기퇴근${icon('alarm-clock')}</div>
      <div class="kpi-num">${s.late + s.early}<small>건</small></div>
      <div class="ks">지각 ${s.late}건(${s.latePeople}명) · 조기퇴근 ${s.early}건 · 재량근로 제외</div></div>
    <div class="kpi info"><div class="kt"><span>추가 체류</span><span class="help">${icon('info')}<span class="tip">${LABELS.extraHelp}. 일반 직원 기준이며, 재량근로자는 야간 체류일수만 집계합니다.</span></span></div>
      <div class="kpi-num">${h1(s.extraGen)}<small>h</small></div>

/* ===================== 배지·태그 ===================== */
function statusBadge(r) {
  const heart = r.disc && (r.status === 'warn' || r.status === 'action') && r.reasons.some(x => x.health) ? icon('heart', 's12') : '';
  const ic = { action: 'triangle-alert', warn: 'alarm-clock', ok: 'circle-check', leave: 'circle-pause', excluded: 'user-x' }[r.status];
  return `<span class="badge ${r.status}">${heart || icon(ic, 's12')}${LABELS.status[r.status]}${heart ? ' · ' + LABELS.healthLabel : ''}</span>`;
}
function discBadge(r) { return r.disc ? `<span class="badge disc">재량근로</span>` : ''; }
function reasonTags(r) {
  if (r.status === 'excluded') return `<span class="tag muted">고정 제외</span>`;
  return r.reasons.map(x => {
    if (x.health) return `<span class="tag health">${icon('heart', 's12')}${LABELS.healthLabel} · ${esc(x.text)}</span>`;
    return `<span class="tag ${x.level}">${esc(x.text)}</span>`;
  }).join('');
}

/* ===================== 개인별 ===================== */

  { k: 'att', l: '출근', c: 'r' }, { k: 'late', l: '지각 · 조퇴', c: 'r' }, { k: 'abs', l: '결근 · 누락', c: 'r' },
  { k: 'leave', l: '휴가', c: 'r' }, { k: 'avgIn', l: '평균 출근', c: 'r' }, { k: 'avgNet', l: '평균 순체류', c: 'r' },
  { k: 'extra', l: '추가 체류', c: 'r' }, { k: 'maxWeek', l: '최대 주 체류', c: 'r' }, { k: 'reasons', l: '판정 사유', ns: 1 }

function sortVal(r, k) {
  const a = r.agg;
  switch (k) {
    case 'status': return STATUS_ORDER[r.status];
    case 'dept': return r.orgRank; case 'name': return r.name;
    case 'att': return a.workdays ? a.attended / a.workdays : -1;
    case 'late': return r.disc ? -1 : a.late + a.early;
    case 'abs': return a.absent + a.missing;
    case 'leave': return a.leaveMin;
    case 'avgIn': return a.avgIn ?? -1; case 'avgNet': return a.avgNet ?? -1;
    case 'extra': return r.disc ? -1 : a.extra;
    case 'maxWeek': return a.maxWeek;
  }

}
function defaultSort(a, b) {
  return (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || orgOrder(a, b) || a.name.localeCompare(b.name, 'ko');
}
function renderPerson(list) {

/* ===================== 상세 패널 ===================== */
function dayClass(d, disc) {
  if (!d) return 'st-none';
  if (d.onLeave) return 'st-leave';
  if (!d.isWorkday) return 'st-hol' + (d.holidayWork ? ' hw' : '');
  if (d.absent || d.missing) return 'st-bad';
  if (!disc && (d.late || d.early)) return 'st-late';
  if (d.fullLeave || ((d.halfAM || d.halfPM) && !d.hasIn && !d.hasOut)) return 'st-vac';
  if (d.halfAM || d.halfPM) return 'st-vac';
  if (d.hasIn || d.hasOut || d.outside) return 'st-ok';
  return 'st-hol';
}
function dayEventText(d, disc, withLeave = true) {
  const e = [];
  if (d.onLeave) e.push('휴직');
  if (d.absent) e.push('결근');
  if (d.missing) e.push('기록누락');
  if (!disc && d.late) e.push('지각');
  if (!disc && d.early) e.push('조기퇴근');
  if (d.otherIssue) e.push('기타 이상(근태이상)');
  if (withLeave && d.leave) e.push(d.leave);
  if (d.holidayWork) e.push('휴일근로');
  if (d.nightDay) e.push('야간 체류');
  return e.join(' · ');
}
function openPanel(name) {

  let cal = ['월', '화', '수', '목', '금', '토', '일'].map(d => `<div class="dh">${d}</div>`).join('');
  cal += '<div></div>'.repeat(lead);
  for (const ds of dates) {

    cal += `<div class="cell ${dayClass(d, r.disc)}" title="${esc(ds + ' ' + (d ? dayEventText(d, r.disc) : ''))}"><span class="d">${+ds.slice(8)}</span><span class="v">${esc(v)}</span></div>`;
  }
  // 타임라인 06:00~30:00
  const X0 = 360, X1 = 1800, pct = m => ((Math.min(Math.max(m, X0), X1) - X0) / (X1 - X0) * 100);
  let axis = '';
  for (let h = 6; h <= 30; h += 3) axis += `<span style="left:${(h * 60 - X0) / (X1 - X0) * 100}%">${String(h % 24).padStart(2, '0')}</span>`;

      ${tl}
      <div class="sec-t">주별 순체류 <span class="s">월~일 · 휴일 포함${r.disc ? ' · ' + LABELS.healthLabel : ''}</span></div>
      ${wk}
      <div class="r28"><div><span>28일 환산 주평균(야간 ×1.3)</span>${r28}</div><div><span>84일(12주) 환산 주평균</span>${r84}</div></div>

/* ===================== 일자별 ===================== */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function destroyChart(k) { if (state.charts[k]) { state.charts[k].destroy(); delete state.charts[k]; } }

function deptStats(rs) {
  const s = { n: rs.length, late: 0, att: 0, netSum: 0, netN: 0, extra: 0, leave: 0, action: 0, warn: 0, disc: rs.length > 0 && rs.every(r => r.disc), anyDisc: rs.some(r => r.disc), genN: 0 };
  for (const r of rs) {
    const a = r.agg;
    s.netSum += a.netSum; s.netN += a.netN; s.leave += a.leaveMin;
    if (!r.disc) { s.late += a.late; s.att += a.attended; s.extra += a.extra; s.genN++; }
    if (r.status === 'action') s.action++; if (r.status === 'warn') s.warn++;
  }
  s.lateRate = s.att ? s.late / s.att : null;
  s.avgNet = s.netN ? s.netSum / s.netN : null;
  s.extraPer = s.genN ? s.extra / s.genN : null;
  s.leavePer = s.n ? s.leave / s.n : null;
  return s;
}
function deptRowHtml(label, s, cls = '', sub = '') {
  const dash = '<span class="dash">---</span>';
  return `<tr class="${cls}"><td>${label}${sub}</td><td class="r">${s.n}</td><td class="c">${s.disc ? '<span class="badge disc">재량근로</span>' : s.anyDisc ? '<span class="badge disc">일부</span>' : ''}</td>
    <td class="r">${s.disc || s.lateRate === null ? dash : (s.lateRate * 100).toFixed(1) + '%'}</td>
    <td class="r">${fmtHM(s.avgNet)}</td>
    <td class="r">${s.disc || s.extraPer === null ? dash : h1(s.extraPer) + 'h'}</td>
    <td class="r">${s.leavePer === null ? dash : h1(s.leavePer) + 'h'}</td>
    <td class="r">${s.action ? `<span class="red">${s.action}</span>` : 0}</td>
    <td class="r">${s.warn ? `<b style="color:var(--warn)">${s.warn}</b>` : 0}</td></tr>`;
}
function orgRowsFor(act) {
  // 조직도 순서로 [{label, s, cls, dept, depth, kind}] 생성
  const t = orgTree(state.settings), byDept = {};
  for (const r of act) (byDept[r.dept] ||= []).push(r);
  const peopleIn = d => [...t.subtree(d)].flatMap(x => byDept[x] || []);
  const out = [];
  const walk = (d, dep) => {
    const sub = peopleIn(d); if (!sub.length) return;
    const kids = t.children(d).filter(c => peopleIn(c).length);
    if (kids.length) {
      out.push({ kind: dep === 0 ? 'top' : 'mid', dept: d, depth: dep, label: dep === 0 ? `${d} 합계` : `${d} 소계`, s: deptStats(sub) });
      if (byDept[d]) out.push({ kind: 'own', dept: d, depth: dep + 1, label: `${d} (직속)`, s: deptStats(byDept[d]) });
      kids.forEach(c => walk(c, dep + 1));
    } else out.push({ kind: dep === 0 ? 'topleaf' : 'leaf', dept: d, depth: dep, label: d, s: deptStats(sub) });
  };
  t.roots().forEach(r => walk(r, 0));
  const un = Object.keys(byDept).filter(d => !t.has(d)).sort((a, b) => a.localeCompare(b, 'ko'));
  if (un.length) {
    out.push({ kind: 'top', dept: '', depth: 0, label: '미배정 합계', s: deptStats(un.flatMap(d => byDept[d])) });
    un.forEach(d => out.push({ kind: 'leaf', dept: d, depth: 1, label: d, s: deptStats(byDept[d]) }));
  }
  return { rows: out, byDept };
}

function sampleSettings() {
  const s = clone(DEFAULT_SETTINGS);
  s.excludeNames = []; s.leaves = [{ name: '갈하윤', start: '2026-09-01', end: '' }];
  s.org = SAMPLE.org.map(([dept, parent]) => ({ dept, parent })); s.discretionDepts = SAMPLE.discretion.slice();
  return s;
}
function buildSampleParsed() {
  let seed = 20261012;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const p2 = n => String(n).padStart(2, '0');
  const hms = sec => `${p2(Math.floor(sec / 3600) % 24)}:${p2(Math.floor(sec / 60) % 60)}:${p2(sec % 60)}`;
  const hm = min => `${p2(Math.floor(min / 60))}:${p2(min % 60)}`;
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  return SAMPLE.months.map(month => {
    const [y, m] = month.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    const rows = [];
    for (const [dept, title, grade, name, kind] of SAMPLE.people) {
      let wdIdx = 0;
      for (let day = 1; day <= last; day++) {
        const date = `${month}-${p2(day)}`, w = new Date(y, m - 1, day).getDay();
        const hol = SAMPLE.holidays[date];
        const r = { dept, title, grade, name, date, dow: DOW[w], dayType: hol || (w === 0 || w === 6 ? '휴일' : '근무일'), status: '', leave: '', workType: '', plan: '', planHours: '', breakPlan: '', otPlan: '', in: '', out: '', worked: '', basic: '', ot: '', leaveHours: '', stay: '' };
        const set = (inS, outS) => { r.in = hms(inS); r.out = hms(outS); r.stay = hm(Math.floor((outS - inS) / 60)); };
        if (r.dayType !== '근무일') {
          if (kind === 'holiday' && w === 6 && !hol && day > 7 && day < 22) set(ri(600, 630) * 60, ri(950, 1010) * 60);
          rows.push(r); continue;
        }
        wdIdx++;
        Object.assign(r, { status: '정상', workType: '기본', plan: '09:00 ~ 18:00', planHours: '08:00', breakPlan: '12:00~13:00', worked: '08:00', basic: '08:00', ot: '00:00', leaveHours: '00:00' });
        let inS = ri(522, 538) * 60 + ri(0, 59), outS = ri(1081, 1093) * 60 + ri(0, 59);
        const k = rnd();
        if (rnd() < 0.1) outS = ri(1140, 1200) * 60 + ri(0, 59);
        if (kind === 'onLeave') { r.status = '결근'; r.worked = r.basic = '00:00'; rows.push(r); continue; }
        if (kind === 'leaveUser' && wdIdx % 6 === 3) { r.leave = '연차'; r.leaveHours = '08:00'; rows.push(r); continue; }
        if (kind === 'leaveUser' && wdIdx % 6 === 5) { r.leave = '오후반차'; r.leaveHours = '04:00'; r.worked = r.basic = '04:00'; set(inS, ri(842, 860) * 60); rows.push(r); continue; }
        if (kind !== 'leaveUser' && kind !== 'absent' && k < 0.03) { r.leave = '연차'; r.leaveHours = '08:00'; rows.push(r); continue; }
        if (kind !== 'leaveUser' && k >= 0.03 && k < 0.045) { r.leave = '오전반차'; r.leaveHours = '04:00'; r.worked = r.basic = '04:00'; set(ri(815, 838) * 60, outS); rows.push(r); continue; }
        if (kind === 'late' && wdIdx % 4 === 1) { r.status = '지각'; inS = ri(543, 566) * 60 + ri(0, 59); }
        if (kind === 'absent' && (wdIdx === 6 || wdIdx === 13)) { r.status = '결근'; r.worked = r.basic = '00:00'; rows.push(r); continue; }
        if (kind === 'missing' && wdIdx === 9) { r.status = '근태이상'; r.in = hms(inS); rows.push(r); continue; }
        if (kind === 'early' && wdIdx % 5 === 2) { r.status = '근태이상'; outS = ri(985, 1020) * 60; }
        if (kind === 'outside' && wdIdx % 7 === 4) { r.leave = '국내출장'; r.in = hms(inS); rows.push(r); continue; }
        if (kind === 'heavy' && day >= 12 && day <= 23) outS = ri(1310, 1375) * 60;
        if (kind === 'heavy2' && day >= 19 && day <= 23) outS = ri(1290, 1330) * 60;
        if (kind === 'heavy' || kind === 'heavy2') { if (!(day >= 12 && day <= 23)) outS = ri(1140, 1215) * 60; }
        if (kind === 'long' && wdIdx % 3 === 0) outS = ri(1300, 1340) * 60;
        if (kind === 'long28') { inS = ri(510, 540) * 60; outS = ri(1335, 1400) * 60; }
        if (kind === 'night' && wdIdx % 3 === 1) { inS = ri(585, 625) * 60; outS = ri(1355, 1420) * 60; }
        set(inS, outS); rows.push(r);
      }
    }
    return { rows, warnings: [], summary: null, fileName: `샘플_${month}`, sheetName: '샘플' };
  });
}
